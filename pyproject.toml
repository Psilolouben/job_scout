[project]
name = "job-scout"
version = "0.1.0"
description = "MCP server that aggregates remote + Greek job boards and filters for Greece-eligible Engineering Manager and AI/forward-deployed roles."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.scripts]
job-scout = "job_scout.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_scout"]
